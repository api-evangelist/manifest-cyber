openapi: 3.2.0
info:
  title: Manifest Cyber Assets API
  description: The Manifest Cyber public REST API allows programmatic management of SBOMs, products, vulnerabilities, and AI/ML bills of materials for software supply-chain security. Authentication uses a Bearer API token generated from organization settings at app.manifestcyber.com.
  version: 1.0.0
  contact:
    name: Manifest Cyber
    url: https://api-docs.manifestcyber.com/
servers:
- url: https://api.manifestcyber.com/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: Assets
  description: Asset and component inventory
paths:
  /assets:
    get:
      tags:
      - Assets
      summary: List assets
      operationId: listAssets
      responses:
        '200':
          description: Assets
  /assets/{assetId}:
    get:
      tags:
      - Assets
      summary: Get asset details (risk, vulnerabilities, components)
      operationId: getAsset
      parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Asset
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'API token from organization settings at app.manifestcyber.com. Send as `Authorization: Bearer <token>`.'
